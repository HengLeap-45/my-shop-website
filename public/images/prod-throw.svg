  <path d="M235 408 H565" stroke="#DDE3DC" stroke-width="8" stroke-dasharray="14 14" stroke-linecap="round" />
  <!-- Fringe Tassels -->
  <g stroke="#D5CEC0" stroke-width="6" stroke-linecap="round">
    <line x1="628" y1="485" x2="665" y2="485" />
    <line x1="628" y1="505" x2="668" y2="505" />
    <line x1="628" y1="525" x2="662" y2="525" />
    <line x1="628" y1="545" x2="670" y2="545" />
    <line x1="628" y1="565" x2="664" y2="565" />
