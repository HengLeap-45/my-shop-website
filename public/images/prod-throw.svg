<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EDEAE2" />
    </radialGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#768576" />
      <stop offset="100%" stop-color="#586759" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  <ellipse cx="400" cy="610" rx="250" ry="26" fill="#1F2937" fill-opacity="0.12" />
  <!-- Folded Layers -->
  <rect x="175" y="455" width="450" height="135" rx="34" fill="#E6E0D3" stroke="#CFC7B6" stroke-width="3" />
  <rect x="175" y="340" width="450" height="135" rx="34" fill="url(#wool)" />
  <rect x="185" y="230" width="430" height="130" rx="34" fill="#8B9A8B" />
