<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EDEAE2" />
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A4E28" />
      <stop offset="50%" stop-color="#B76D3B" />
      <stop offset="100%" stop-color="#7B421E" />
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  <ellipse cx="400" cy="690" rx="135" ry="20" fill="#1F2937" fill-opacity="0.14" />
  <!-- Top & Bottom Leather Strap -->
  <rect x="336" y="105" width="128" height="165" rx="18" fill="url(#strap)" />
  <rect x="336" y="530" width="128" height="155" rx="22" fill="url(#strap)" />
  <!-- Stitching -->
  <line x1="350" y1="120" x2="350" y2="255" stroke="#DFB189" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="450" y1="120" x2="450" y2="255" stroke="#DFB189" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="350" y1="545" x2="350" y2="665" stroke="#DFB189" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="450" y1="545" x2="450" y2="665" stroke="#DFB189" stroke-width="2" stroke-dasharray="6 5" />
  <!-- Crown & Pushers -->
  <rect x="556" y="382" width="22" height="36" rx="5" fill="#9CA3AF" />
  <rect x="545" y="318" width="18" height="22" rx="4" transform="rotate(25 545 318)" fill="#9CA3AF" />
  <rect x="540" y="458" width="18" height="22" rx="4" transform="rotate(-25 540 458)" fill="#9CA3AF" />
  <!-- Watch Case -->
  <circle cx="400" cy="400" r="165" fill="url(#steel)" />
  <circle cx="400" cy="400" r="146" fill="#F8F5EC" stroke="#D1D5DB" stroke-width="4" />
  <!-- Subdials -->
  <circle cx="348" cy="400" r="32" fill="#EFECE2" stroke="#D6D3C9" stroke-width="2" />
  <circle cx="452" cy="400" r="32" fill="#EFECE2" stroke="#D6D3C9" stroke-width="2" />
  <!-- Hour Markers -->
  <g stroke="#1F2937" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="270" x2="400" y2="288" />
    <line x1="400" y1="512" x2="400" y2="530" />
    <line x1="270" y1="400" x2="288" y2="400" />
    <line x1="512" y1="400" x2="530" y2="400" />
  </g>
  <!-- Hands -->
  <line x1="400" y1="400" x2="345" y2="335" stroke="#111827" stroke-width="8" stroke-linecap="round" />
  <line x1="400" y1="400" x2="482" y2="352" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="420" x2="400" y2="285" stroke="#C26D2D" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="400" cy="400" r="8" fill="#0F4C5C" />
</svg>
